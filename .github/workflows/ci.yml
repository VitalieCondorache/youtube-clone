name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# a new push to the same branch cancels the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (build + unit tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Angular CLI 22 needs Node 22.22.3+, 24.15+ or 26+
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # fails on TypeScript or template errors
      - name: Build
        run: npm run build

      # the unit test builder watches by default, CI needs a single run
      - name: Unit tests
        run: npm test -- --watch=false

  api:
    name: API (install + syntax check)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
